plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'com.netrobot.drone'
    compileSdk 36
    defaultConfig {
        applicationId 'com.netrobot.drone'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython(System.getenv('NETROBOT_BUILD_PYTHON') ?: 'python')
        staticProxy 'drone_android'
    }
}
